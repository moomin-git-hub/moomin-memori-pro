<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ilovalarni bog'lash</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b16;--mute:#6b665b;--line:#e6e1d6;--acc:#b8892e;--ok:#2f8f5b;--bad:#c2463a}
@media (prefers-color-scheme:dark){:root{--bg:#141310;--card:#1d1c18;--ink:#f1ede3;--mute:#a59f92;--line:#2f2d27}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:460px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:0 10px 30px -18px rgba(0,0,0,.25)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ic{width:44px;height:44px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
h1{font-size:20px;margin:0;line-height:1.25}small{color:var(--mute);display:block;font-size:13px}
p{margin:10px 0;color:var(--mute);font-size:14.5px}b{color:var(--ink)}
.arrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0;font-weight:700}
.pill{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px;background:var(--line);color:var(--ink);text-decoration:none}
.btn.pri{background:var(--acc);color:#fff}.btn:disabled{opacity:.5}
code{display:block;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;margin-top:8px;user-select:all}
.msg{font-size:14px;margin-top:12px;min-height:1em}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
ul{margin:8px 0 0;padding-left:18px;color:var(--mute);font-size:14px}
</style>
</head>
<body>
<main><div class="card" id="box"><p>Yuklanmoqda…</p></div></main>
<script>
"use strict";
const APP = {
  id: "memori", name: "ME'MORI",
  gives: ["o'rganish bo'limlaringizni ME'MORI'ga yuborish (so'zlar, kartochkalar, oyatlar, iqtiboslar, o'qilayotgan kitob)", "bugungi takror soni va XOTIR balansi", "ME'MORI orqali Vaqt Banki ulanishini o'rnatish"],
  async getKey() {
    let r = await fetch("/api/key", { credentials: "same-origin", cache: "no-store" });
    if (r.status === 401) throw new Error("ME'MORI'da hisobga kirilmagan.");
    if (!r.ok) throw new Error("Server javob bermadi, birozdan keyin urining.");
    let k = (await r.json()).key;
    if (!k) { r = await fetch("/api/key", { method: "POST", credentials: "same-origin" }); if (!r.ok) throw new Error("Kalit yaratilmadi."); k = (await r.json()).key; }
    return k;
  },
  async newKey() { const r = await fetch("/api/key", { method: "POST", credentials: "same-origin" }); if (!r.ok) throw new Error("Yangi kalit yaratilmadi."); }
};
const box = document.getElementById("box");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NAMES = {momin: "Mo'min", memori: "ME'MORI", vaqt: "Vaqt Banki", hisob: "Hisob"};
function target() {
  const t = new URLSearchParams(location.search).get("to");
  if (!t) return null;
  try { const u = new URL(t); if (u.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(u.hostname)) return u; } catch (e) {}
  return null;
}
async function run() {
  let key;
  try { key = await APP.getKey(); }
  catch (e) {
    box.innerHTML = `<div class="top"><span class="ic">${esc(APP.name[0])}</span><div><h1>${esc(APP.name)} ga kiring</h1><small>Bog'lash uchun avval shu ilovada hisobingizga kirgan bo'lishingiz kerak.</small></div></div>
      <p>${esc(e && e.message || "Hisobga kirilmagan.")}</p><a class="btn pri" href="/">${esc(APP.name)} ni ochish</a>
      <p style="font-size:13px">Kirib bo'lgach, avvalgi ilovaga qaytib «Ulash» tugmasini yana bosing.</p>`;
    return;
  }
  const code = location.origin + "/link#" + key, to = target();
  const from = new URLSearchParams(location.search).get("app") || "";
  if (to) {
    box.innerHTML = `<div class="top"><span class="ic">${esc(APP.name[0])}</span><div><h1>${esc(NAMES[from] || to.hostname)} bilan bog'lash</h1><small>${esc(APP.name)} · ${esc(location.host)}</small></div></div>
      <div class="arrow"><span class="pill">${esc(APP.name)}</span>⇄<span class="pill">${esc(to.hostname)}</span></div>
      <p><b>${esc(to.hostname)}</b> quyidagilarni oladi:</p><ul>${APP.gives.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <p style="font-size:13px">Parolingiz va boshqa ma'lumotlaringiz berilmaydi. Istagan payt shu ilovada kalitni yangilab, bog'lanishni uzasiz.</p>
      <button class="btn pri" id="go">Ruxsat berish va qaytish</button><a class="btn" href="/">Bekor qilish</a>`;
    document.getElementById("go").onclick = () => {
      const back = to.href.replace(/#.*$/, "") + "#link=" + encodeURIComponent(code) + "&from=" + APP.id;
      location.replace(back);
    };
    return;
  }
  box.innerHTML = `<div class="top"><span class="ic">${esc(APP.name[0])}</span><div><h1>${esc(APP.name)}: ulanish kodi</h1><small>Boshqa ilovaga shu kodni qo'ying</small></div></div>
    <p>Odatda bu kod kerak emas: Mo'min yoki ME'MORI'dagi «Ulash» tugmasi uni o'zi oladi. Qo'lda ulash kerak bo'lsa, nusxalang:</p>
    <code id="code">${esc(code)}</code><button class="btn pri" id="cp">Nusxalash</button>
    ${APP.newKey ? `<button class="btn" id="nw">Yangi kalit (eski bog'lanishlar uziladi)</button>` : ""}
    <a class="btn" href="/">${esc(APP.name)} ga qaytish</a><div class="msg" id="msg"></div>`;
  const msg = (t, c) => { const m = document.getElementById("msg"); m.textContent = t; m.className = "msg " + (c || ""); };
  document.getElementById("cp").onclick = async () => { try { await navigator.clipboard.writeText(code); msg("Nusxalandi.", "ok"); } catch (e) { msg("Kodni belgilab nusxalang.", ""); } };
  if (APP.newKey) document.getElementById("nw").onclick = async () => { if (!confirm("Yangi kalit yaratilsinmi? Bog'langan ilovalarni qayta ulash kerak bo'ladi.")) return; try { await APP.newKey(); run(); } catch (e) { msg(e.message || "Bo'lmadi.", "bad"); } };
}
run();
</script>
</body>
</html>
