<title>ME'MORI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Urbanist:wght@500..800&display=swap">
<style>
/* Layout: a phone-first app in the Orrin manner. A glowing gradient hero carries the big number,
   month chips pick the period, two stat cards sit under it, and everything else is rounded cards
   on a deep navy ground. A floating pill nav and a gradient plus button stay at the bottom.
   Dark is the default skin; the moon button switches to the light skin of the owner's Hisob app. */
:root{
  color-scheme:dark;
  --bg:#05060f; --bg2:#0b0f26; --card:#10153a; --card2:#161c48; --line:#232a5c; --edge:#36408a;
  --text:#f4f6ff; --mute:#8d95c0; --pri:#4b6bfb; --pri-hi:#6683ff; --on-pri:#ffffff;
  --grad:linear-gradient(135deg,#33d6c4 0%,#4b6bfb 55%,#5a3ff0 100%);
  --hero:radial-gradient(120% 110% at 15% 0%,#2f52e6 0%,#18288a 42%,#0a0f33 78%,#070a22 100%);
  --hero-text:#ffffff; --hero-mute:rgba(255,255,255,.72); --hero-pill:rgba(255,255,255,.12);
  --ok:#2fd08f; --bad:#ff6f7d; --warn:#f6b73c; --chip:#161c48;
  --nav:rgba(13,17,46,.9); --shadow:0 12px 32px rgba(0,0,0,.45); --glow:rgba(75,107,251,.35);
  --scrim:rgba(2,3,12,.72);
  --display:"Urbanist","Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:24px; --r-md:18px; --r-sm:12px;
}
:root[data-skin="light"]{
  color-scheme:light;
  --bg:#eef3fb; --bg2:#f6f8fd; --card:#ffffff; --card2:#f3f6fc; --line:#e1e7f3; --edge:#c9d3ea;
  --text:#0b1240; --mute:#6b7596; --pri:#2f5bea; --pri-hi:#4570ff; --on-pri:#ffffff;
  --hero:linear-gradient(140deg,#2f5bea 0%,#4f7bff 60%,#7aa0ff 100%);
  --hero-pill:rgba(255,255,255,.18); --chip:#e6ecf8;
  --nav:rgba(255,255,255,.94); --shadow:0 10px 28px rgba(31,52,120,.12); --glow:rgba(47,91,234,.25);
  --scrim:rgba(11,18,64,.35);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:500 .9375rem/1.5 var(--ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;transition:background-color .25s}
h1,h2,h3,p,ol,ul,fieldset,legend,dl,dd{margin:0;padding:0}
ol,ul{list-style:none}
fieldset{border:0;min-width:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pri-hi);outline-offset:2px}
html.locked{overflow:hidden}
svg{width:1.375rem;height:1.375rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.grow{flex:1}
.muted{color:var(--mute)}
.small{font-size:.8125rem}
.hot{color:var(--pri-hi)}
:root[data-skin="light"] .hot{color:var(--pri)}

/* frame */
.shell{max-width:40rem;margin-inline:auto;padding-inline:1rem;padding-block:0 9rem}
.top{display:flex;align-items:center;gap:.75rem;padding-block:1rem .875rem}
.ava{width:2.75rem;height:2.75rem;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--grad);color:#fff;font:700 1.0625rem/1 var(--display);overflow:hidden;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--glow)}
.ava img{width:100%;height:100%;object-fit:cover}
.hello{min-width:0;flex:1;display:grid;line-height:1.2}
.hello span{font-size:.8125rem;color:var(--mute)}
.hello b{font:700 1.125rem/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:var(--mute);flex:none;margin-left:.375rem;vertical-align:middle}
.sync[data-s="synced"]{background:var(--ok)}
.sync[data-s="saving"],.sync[data-s="connecting"]{background:var(--warn)}
.sync[data-s="error"]{background:var(--bad)}
.ibtn{width:2.75rem;height:2.75rem;display:grid;place-items:center;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);flex:none}
.ibtn svg{width:1.25rem;height:1.25rem}
.ibtn:active{transform:scale(.94)}

.nav{position:fixed;left:.75rem;right:.75rem;bottom:calc(.75rem + env(safe-area-inset-bottom,0px));z-index:20;max-width:34rem;margin-inline:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.125rem;padding:.375rem;border-radius:28px;background:var(--nav);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nav button{position:relative;display:grid;justify-items:center;gap:.125rem;padding:.5rem .125rem .4375rem;border:0;border-radius:22px;background:none;color:var(--mute);font:600 .6875rem/1.15 var(--ui);min-width:0}
.nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button[aria-current="page"]{color:var(--pri-hi);background:var(--card2)}
:root[data-skin="light"] .nav button[aria-current="page"]{color:var(--pri)}
.badge{position:absolute;top:.25rem;left:calc(50% + .375rem);min-width:1.125rem;height:1.125rem;padding-inline:.25rem;border-radius:999px;background:var(--bad);color:#fff;font:800 .625rem/1.125rem var(--ui);text-align:center}
.fab{position:fixed;right:max(1rem,calc(50% - 19rem));bottom:calc(5.75rem + env(safe-area-inset-bottom,0px));z-index:21;width:3.75rem;height:3.75rem;border:0;border-radius:20px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px var(--glow);transition:transform .15s}
.fab svg{width:1.75rem;height:1.75rem;stroke-width:2.2}
.fab:active{transform:scale(.92)}
.fab-ai{width:3.25rem;height:3.25rem;border-radius:17px;right:max(1.25rem,calc(50% - 18.75rem));bottom:calc(10.25rem + env(safe-area-inset-bottom,0px));background:linear-gradient(140deg,#8b5cf6,#5b5bf0);box-shadow:0 10px 24px rgba(108,92,231,.38)}
.fab-ai svg{width:1.5rem;height:1.5rem;fill:currentColor;stroke:none}
.gl-ans{display:grid;gap:.75rem;padding:1rem;border-radius:18px;background:var(--bg2);border:1px solid var(--line)}
.gl-ans .gl-w{font:800 1.25rem/1.2 var(--display)}
.gl-list{display:grid;gap:.5rem}
.gl-it{display:grid;gap:.125rem;text-align:left;padding:.75rem .875rem;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.gl-it b{font-weight:800}.gl-it small{color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gl-it .gl-src{font-size:.75rem;color:var(--mute)}

.view{display:grid;gap:1.25rem}
.view>*{min-width:0}
.sec{display:grid;gap:.75rem}
.sec>*{min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem 1rem;flex-wrap:wrap}
.eyebrow{font:700 .75rem/1.3 var(--ui);letter-spacing:.04em;color:var(--mute);overflow-wrap:anywhere}
.h1{font:800 1.75rem/1.15 var(--display);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.h2{font:800 1.1875rem/1.25 var(--display)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.125rem}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:1.25rem 1.25rem 1.125rem;background:var(--hero);color:var(--hero-text);box-shadow:0 18px 40px var(--glow)}
.hero::after{content:"";position:absolute;right:-3rem;top:-3rem;width:11rem;height:11rem;border-radius:50%;background:radial-gradient(circle,rgba(52,214,196,.45),transparent 65%);pointer-events:none}
.hero-lbl{font-size:.875rem;color:var(--hero-mute);display:flex;align-items:center;gap:.375rem}
.hero-n{font:800 3.25rem/1 var(--display);letter-spacing:-.02em;margin-block:.5rem .875rem;font-variant-numeric:tabular-nums}
.hero-n small{font:700 1rem var(--ui);color:var(--hero-mute);letter-spacing:0;margin-left:.25rem}
.pills{display:flex;flex-wrap:wrap;gap:.5rem;position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:.375rem;padding:.375rem .75rem;border-radius:999px;background:var(--hero-pill);border:1px solid rgba(255,255,255,.18);font:700 .8125rem/1.2 var(--ui);color:#fff}
.pill svg{width:1rem;height:1rem}
.periods{display:flex;gap:.375rem;overflow-x:auto;scrollbar-width:none;margin-inline:-1rem;padding-inline:1rem;scroll-snap-type:x proximity}
.periods::-webkit-scrollbar{display:none}
.per{flex:none;border:0;border-radius:999px;padding:.5rem .9375rem;background:none;color:var(--mute);font:800 .875rem/1 var(--display);letter-spacing:.02em;scroll-snap-align:center}
.per[aria-pressed="true"]{background:var(--pri);color:#fff;box-shadow:0 6px 16px var(--glow)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
.stat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.125rem .75rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:1rem}
.stat .tile{grid-row:span 2}
.stat span{font-size:.8125rem;color:var(--mute)}
.stat b{font:800 1.375rem/1.1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat em{grid-column:1/-1;font-style:normal;font-size:.75rem;color:var(--mute);margin-top:.25rem}
.tile{width:2.5rem;height:2.5rem;border-radius:14px;display:grid;place-items:center;color:var(--c,var(--pri));background:color-mix(in srgb,var(--c,var(--pri)) 18%,transparent);flex:none}
.tile svg{width:1.25rem;height:1.25rem}
.c-blue{--c:#5a7bff}.c-green{--c:#2fd08f}.c-red{--c:#ff6f7d}.c-purple{--c:#a07bff}.c-orange{--c:#ff9f43}.c-teal{--c:#22c7c7}.c-pink{--c:#ff6fae}.c-yellow{--c:#f6b73c}

/* review card with a ring */
.revcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center}
.ring{position:relative;width:5.25rem;height:5.25rem}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line);stroke-width:8}
.ring .val{stroke:url(#ringGrad);stroke-width:8;transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 1.375rem/1 var(--display)}
.revcard .h2{margin-bottom:.125rem}
.revcard .acts{grid-column:1/-1}
.due-zero{font:800 1.125rem/1.3 var(--display)}

/* buttons, chips, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.625rem 1.25rem;border-radius:16px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:700 .9375rem/1.15 var(--ui);text-align:center;transition:transform .12s,background-color .2s}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--pri);border-color:var(--pri);color:var(--on-pri);box-shadow:0 8px 20px var(--glow)}
.btn-gold:hover{background:var(--pri-hi)}
.btn-danger{background:none;border-color:transparent;color:var(--bad);padding-inline:.25rem}
.btn-danger[data-armed]{border-color:var(--bad);padding-inline:.875rem}
.btn-sm{min-height:2.375rem;padding:.4375rem .875rem;font-size:.8125rem;border-radius:13px}
.btn-wide{width:100%}
.btn svg{width:1.125rem;height:1.125rem}
.link{background:none;border:0;padding:0;color:var(--pri-hi);font-weight:700;text-decoration:none}
:root[data-skin="light"] .link{color:var(--pri)}
.back{display:inline-flex;align-items:center;gap:.25rem;background:none;border:0;padding:.25rem 0;color:var(--mute);font:700 .875rem/1 var(--ui)}
.back svg{width:1.125rem;height:1.125rem}
.icon-btn{display:grid;place-items:center;width:2.75rem;height:2.75rem;background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--text)}
.acts{display:flex;flex-wrap:wrap;gap:.5rem}
.chips{display:flex;flex-wrap:wrap;gap:.4375rem}
.chip{display:inline-flex;align-items:center;gap:.375rem;min-height:2.25rem;padding:.375rem .875rem;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--text);font:700 .8125rem/1 var(--ui);cursor:pointer}
.chip[aria-pressed="true"],.chip:has(input:checked){background:var(--pri);border-color:var(--pri);color:#fff}
.chip:has(input:focus-visible){outline:2px solid var(--pri-hi);outline-offset:2px}
.scroller{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-1rem;padding-inline:1rem}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}
.chip svg{width:1rem;height:1rem}
.field{display:grid;gap:.375rem;min-width:0}
.field>label,.field>legend{font:700 .8125rem/1.3 var(--ui);color:var(--mute)}
.field>.big-label{font:800 1.125rem/1.3 var(--display);color:var(--text);text-wrap:balance}
.opt{font-weight:500;opacity:.75}
input[type="text"],input[type="number"],input[type="search"],input[type="email"],input[type="password"],textarea,select{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:16px;color:var(--text);font:500 1rem/1.5 var(--ui);padding:.75rem .9375rem;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--pri);outline:none}
textarea{display:block;resize:vertical;min-height:4.5rem}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.75}
input[type="file"]{max-width:100%;font-size:.875rem;color:var(--mute)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
.err{color:var(--bad);font-size:.875rem;font-weight:700}
.notice{display:grid;gap:.5rem;border-radius:var(--r-md);padding:.875rem 1rem;font-size:.875rem;background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.notice .link{justify-self:start;color:var(--warn)}
.check{display:flex;gap:.5rem;align-items:flex-start;font-size:.875rem;cursor:pointer}
.check input{margin-top:.25rem;accent-color:var(--pri)}

/* source cards and rows */
.rows{display:grid;gap:.625rem}
.src{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.25rem .875rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:.875rem 1rem;text-align:left;width:100%;color:var(--text)}
.src .tile{grid-row:span 2}
.src .bar,.src .row-foot{grid-column:2/-1}
.src-main{display:grid;gap:.125rem;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.bk-title{font:800 1.0625rem/1.25 var(--display);overflow-wrap:anywhere}
.bk-meta{color:var(--mute);font-size:.8125rem;overflow-wrap:anywhere}
.row-foot,.item-what{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .75rem;min-width:0}
.row-foot,.item-head{font-size:.8125rem;color:var(--mute)}
.row-btn{display:grid;gap:.4375rem;width:100%;min-width:0;text-align:left;color:var(--text);border-radius:var(--r-md);padding:.875rem 1rem;border:1px solid color-mix(in srgb,var(--c,var(--pri)) 22%,var(--line));background:color-mix(in srgb,var(--c,var(--pri)) 9%,var(--card))}
.item-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:.75rem}
.item-when{display:flex;align-items:center;gap:.5rem;min-height:1.25rem;white-space:nowrap}
.ref{color:var(--text);overflow-wrap:anywhere;min-width:0;font-weight:700}
.item-text{font:600 .9375rem/1.45 var(--ui);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:.25rem;font:800 .6875rem/1 var(--ui);color:var(--c,var(--pri-hi));background:color-mix(in srgb,var(--c,var(--pri)) 16%,transparent);border-radius:999px;padding:.3125rem .5625rem;white-space:nowrap}
.tag-demo{--c:#f6b73c}
.tag-momin{--c:#3f9a74}
.tg-docs{display:grid;gap:.75rem;margin:.75rem 0;padding:.75rem;border:1px solid var(--line);border-radius:18px}
.tg-docs .srow{padding:0;border:0;background:none}
.lk{display:grid;gap:10px}
.lk-row{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card, transparent)}
.lk-row .tile{flex:none}
.lk-t{flex:1;min-width:0}.lk-t b{display:block}.lk-t small{display:block;color:var(--mute);line-height:1.45}
.lk-st{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;margin-top:6px}
.lk-st i{width:8px;height:8px;border-radius:50%;background:var(--mute)}.lk-st.on i{background:#2f9e5f}.lk-st.bad i{background:#d0533f}
.lk-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bar{display:block;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bar-cap{margin-top:.375rem;font-variant-numeric:tabular-nums}
.ladder{display:inline-flex;align-items:flex-end;gap:2px;height:.875rem;flex:none}
.ladder i{width:3px;border-radius:2px;background:var(--line)}
.ladder i.on{background:var(--pri-hi)}
.ladder i:nth-child(1){height:30%}.ladder i:nth-child(2){height:40%}.ladder i:nth-child(3){height:50%}.ladder i:nth-child(4){height:60%}
.ladder i:nth-child(5){height:70%}.ladder i:nth-child(6){height:80%}.ladder i:nth-child(7){height:90%}.ladder i:nth-child(8){height:100%}
.hist{display:inline-flex;align-items:flex-end;gap:2px;height:.875rem;flex:none}
.hist i{width:4px;min-height:2px;border-radius:2px;background:var(--edge)}
.hist i.far{background:var(--ok)}
.hist i.nil{min-height:1px;height:1px;background:var(--line)}
.dueb{display:inline-flex;align-items:center;justify-content:center;min-width:1.75rem;height:1.75rem;padding-inline:.5rem;border-radius:999px;background:var(--pri);color:#fff;font:800 .75rem/1 var(--ui)}
.src-go{width:2.5rem;height:2.5rem;border-radius:14px;border:0;display:grid;place-items:center;background:var(--grad);color:#fff;grid-row:span 2}
.src-go svg{width:1.25rem;height:1.25rem}

/* goals */
.goals{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(11.5rem,72%);gap:.75rem;overflow-x:auto;scrollbar-width:none;margin-inline:-1rem;padding-inline:1rem;scroll-snap-type:x mandatory}
.goals::-webkit-scrollbar{display:none}
.goal{scroll-snap-align:start;display:grid;gap:.5rem;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:1rem;color:var(--text)}
.goal b{font:800 1.5rem/1 var(--display);font-variant-numeric:tabular-nums}
.goal b small{font:700 .875rem var(--ui);color:var(--mute)}
.goal p{font-size:.8125rem;color:var(--mute)}
.goal.add{place-content:center;justify-items:center;border-style:dashed;color:var(--pri-hi);font-weight:800;min-height:8rem}
.goal.done{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}

/* journal */
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3125rem}
.heat span{font:700 .6875rem/1 var(--ui);color:var(--mute);text-align:center;padding-bottom:.25rem}
.heat i{aspect-ratio:1;max-width:100%;border-radius:9px;background:var(--card2);display:grid;place-items:center;font:700 .75rem/1 var(--ui);font-style:normal;color:var(--mute)}
.heat i.l1{background:color-mix(in srgb,var(--pri) 28%,var(--card2));color:var(--text)}
.heat i.l2{background:color-mix(in srgb,var(--pri) 55%,var(--card2));color:#fff}
.heat i.l3{background:var(--pri);color:#fff}
.heat i.today{outline:2px solid var(--ok);outline-offset:-2px}
.heat i.blank{background:none}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;padding-top:.5rem}
.day-h b{font:800 1rem/1.3 var(--display)}
.day-h span{font:800 .875rem var(--ui);color:var(--ok);white-space:nowrap}
.date-pill{justify-self:center;padding:.375rem 1rem;border-radius:999px;background:var(--card2);font:700 .8125rem var(--ui);color:var(--mute)}

/* figures and charts */
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
.fig{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:1rem}
.fig b{display:block;font:800 1.75rem/1 var(--display);font-variant-numeric:tabular-nums}
.fig span{display:block;margin-top:.4375rem;font-size:.75rem;line-height:1.35;color:var(--mute)}
.chart{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.25rem;border-bottom:1px solid var(--line)}
.col{display:grid;grid-template-rows:1rem 5.5rem;gap:.25rem;justify-items:center;min-width:0}
.col-v{font:700 .75rem/1rem var(--ui);font-variant-numeric:tabular-nums}
.col-t{display:flex;align-items:flex-end;justify-content:center;width:100%;height:5.5rem}
.col-t i{display:block;width:100%;max-width:1.625rem;height:0;background:var(--edge);border-radius:8px 8px 3px 3px;transition:height .7s cubic-bezier(.2,.7,.2,1)}
.col-t i.far{background:var(--grad)}
.axis{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.25rem;margin-top:-.375rem}
.axis span{font:700 .625rem/1.2 var(--ui);color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.axis span.far{color:var(--pri-hi)}
.donut-wrap{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:1rem;align-items:center}
.donut{position:relative;width:9rem;height:9rem}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{stroke-width:16;fill:none}
.donut b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:800 1.5rem/1 var(--display)}
.donut b small{display:block;font:700 .6875rem var(--ui);color:var(--mute);margin-top:.25rem}
.legend{display:grid;gap:.375rem;font-size:.8125rem}
.legend p{display:flex;align-items:center;gap:.5rem}
.legend i{width:.625rem;height:.625rem;border-radius:50%;background:var(--c);flex:none}
.legend span{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.map-wrap{overflow-x:auto}
.map{display:block;width:100%;max-width:30rem;height:auto}
.map .edge{stroke:var(--pri);stroke-opacity:.6;stroke-linecap:round;fill:none}
.map .node{fill:var(--pri-hi);stroke:var(--card);stroke-width:2}
.map .lbl{fill:var(--text);font:700 10px var(--ui)}
.how summary{cursor:pointer;font:800 .9375rem/1.3 var(--ui)}
.how[open] summary{margin-bottom:.75rem}
.rules{display:grid;gap:.375rem;color:var(--mute);font-size:.875rem}
.rules b{color:var(--text)}
.sync-line{display:flex;align-items:baseline;gap:.25rem;font-size:.875rem}

/* intro, steps */
.intro{display:grid;gap:1.25rem}
.lead{font-size:1rem;line-height:1.6;color:var(--mute);max-width:60ch}
.steps{display:grid;gap:.75rem;counter-reset:st}
.steps li{display:grid;grid-template-columns:2.25rem minmax(0,1fr);gap:.75rem;counter-increment:st;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:.875rem}
.steps li::before{content:counter(st);width:2.25rem;height:2.25rem;border-radius:12px;display:grid;place-items:center;background:var(--grad);color:#fff;font:800 1rem/1 var(--display)}
.steps b{display:block;font:800 1rem/1.35 var(--display)}
.steps span{color:var(--mute);font-size:.875rem}

/* methods library */
.mlist{display:grid;gap:.625rem}
.m{display:grid;gap:.375rem;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:.9375rem 1rem}
.m-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.25rem .75rem}
.m h3{font:800 1rem/1.3 var(--display);margin:0}
.m p{max-width:62ch;font-size:.875rem;color:var(--mute)}
.m .m-meta{display:flex;flex-wrap:wrap;gap:.375rem;font-size:.75rem}
.m .m-meta span{padding:.1875rem .5rem;border-radius:999px;background:var(--chip);color:var(--mute);font-weight:700}
.m .m-meta span.hot{background:color-mix(in srgb,var(--pri) 18%,transparent)}
.lv{font:800 .6875rem/1 var(--ui);padding:.3125rem .5625rem;border-radius:999px;white-space:nowrap;color:var(--mute);background:var(--chip)}
.lv3{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.lv2{color:var(--pri-hi);background:color-mix(in srgb,var(--pri) 16%,transparent)}
.lv0{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}

/* sheets */
dialog{border:0;padding:0;color:var(--text);max-width:100%;max-height:100%}
dialog::backdrop{background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog.sheet{width:100%;max-width:36rem;max-height:92%;margin:auto auto 0;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;border-top:1px solid var(--line)}
dialog.full{width:100%;height:100%;margin:0;overflow:auto;background:var(--bg)}
.sheet-body{display:grid;gap:1.125rem;padding:1.25rem 1.125rem calc(1.25rem + env(safe-area-inset-bottom,0px))}
.sheet-body::before{content:"";justify-self:center;width:2.75rem;height:5px;border-radius:999px;background:var(--line);margin-top:-.375rem}
.sheet-body>*{min-width:0}
.sheet-h{font:800 1.375rem/1.2 var(--display);text-wrap:balance;overflow-wrap:anywhere}
.sheet-h:focus{outline:none}
.sheet-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:.625rem}
.hints{display:grid;gap:.1875rem;color:var(--mute);font-size:.875rem}
.hints li{display:grid;grid-template-columns:.75rem minmax(0,1fr);align-items:baseline}
.hints li::before{content:"";width:.3125rem;height:.3125rem;border-radius:50%;background:var(--pri-hi);transform:translateY(-.1875rem)}
.cards{display:grid;gap:.875rem}
.cards:empty{display:none}
.card-pair{display:grid;gap:.625rem;padding:.75rem;border-radius:var(--r-md);background:var(--bg2);border:1px solid var(--line)}
.item-state{display:flex;flex-wrap:wrap;align-items:center;gap:.375rem .625rem;font-size:.8125rem;color:var(--mute)}
.tech{border-radius:var(--r-md);background:var(--bg2);border:1px solid var(--line);padding:.875rem 1rem}
.tech>summary{display:grid;gap:.125rem;cursor:pointer;list-style:none}
.tech>summary::-webkit-details-marker{display:none}
.tech>summary b{font:800 1rem/1.3 var(--display)}
.tech>summary b::before{content:"+";display:inline-block;width:1.25rem;color:var(--pri-hi)}
.tech[open]>summary b::before{content:"–"}
.tech>summary span{padding-left:1.25rem;font-size:.8125rem;color:var(--mute)}
.tech[open]>summary{margin-bottom:.875rem}
.tech-body{display:grid;gap:.75rem}
.rm{justify-self:start}
.pre{display:grid;gap:.25rem;padding:.75rem .875rem;border-radius:var(--r-sm);background:color-mix(in srgb,var(--pri) 10%,var(--card));font-style:italic}
.focus{display:grid;gap:.625rem;padding:1.125rem;border-radius:var(--r-lg);background:var(--card);border:1px solid color-mix(in srgb,var(--pri) 45%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 10%,transparent)}
.focus-t{font:800 3rem/1 var(--display);font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.gap{display:inline-block;min-width:3.5em;margin-inline:.1em;border-bottom:2px solid var(--pri-hi);color:var(--mute);text-align:center}
mark{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);border-radius:4px;padding-inline:.15em;font-weight:800}
.hint{margin-top:.625rem;font-style:italic;color:var(--pri-hi)}
.mnemo{display:block;margin-top:.875rem;font-size:.9375rem;color:var(--mute)}
.mnemo b{color:var(--text)}
.msgs{display:grid;gap:.75rem}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:.75rem .875rem;border-radius:18px 18px 18px 6px;background:var(--bg2);border:1px solid var(--line);max-width:92%}
.msg.me{justify-self:end;border-radius:18px 18px 6px 18px;background:var(--pri);border-color:var(--pri);color:#fff}
.chat-in{display:grid;gap:.75rem}
.qhint{color:var(--warn)}
.hc{color:var(--warn);font-weight:700}
.result{display:grid;gap:.25rem}

/* review */
.rv{max-width:40rem;min-height:100%;margin-inline:auto;padding-inline:1.125rem;display:grid;grid-template-rows:auto 1fr}
.rv-top{display:flex;align-items:center;gap:.875rem;min-height:4rem;padding-top:env(safe-area-inset-top,0px)}

.rv-count{font:800 .9375rem var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.rv-body{display:grid;gap:1.125rem;align-content:start;padding-block:1rem calc(2.5rem + env(safe-area-inset-bottom,0px))}
.rv-body>*{min-width:0}
.rv-q{font:800 1.5rem/1.3 var(--display);text-wrap:balance;overflow-wrap:anywhere}

.rv-ans{display:grid;gap:.875rem;padding:1.125rem;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line)}
.rv-ask{margin-top:.25rem}
.note{font-size:1.0625rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-width:62ch}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.grade{display:grid;gap:.25rem;align-content:center;justify-items:center;min-height:4.25rem;padding:.625rem .25rem;border-radius:18px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 14%,var(--card));text-align:center;color:var(--text);transition:transform .12s}
.grade:active{transform:scale(.95)}
.grade[data-g="0"]{--c:#ff6f7d}.grade[data-g="1"]{--c:#f6b73c}.grade[data-g="2"]{--c:#2fd08f}
.grade b{font:800 .9375rem/1.15 var(--ui);color:var(--c)}
.grade span{font-size:.6875rem;line-height:1.2;color:var(--mute)}
.rv-done .btn{justify-self:start}

/* onboarding, in the light Orrin manner */
dialog.onb{width:100%;height:100%;margin:0;overflow:auto;background:linear-gradient(180deg,#f4f8ff 0%,#dfeafd 100%);color:#0b1240}
.onb-in{max-width:30rem;min-height:100%;margin-inline:auto;padding:calc(1rem + env(safe-area-inset-top,0px)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom,0px));display:grid;grid-template-rows:auto auto 1fr auto auto;gap:1.25rem}
.onb-top{display:flex;align-items:center;justify-content:space-between}
.onb-top button{background:none;border:0;color:#2f7fd0;font:700 .9375rem var(--ui)}
.onb-n{font:800 1.5rem var(--display)}
.onb-n i{font-style:normal;color:#ef5350}
.onb-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.onb-bars i{height:5px;border-radius:999px;background:#c9d8ef}
.onb-bars i.on{background:#0b62b5}
.onb-art{display:grid;place-items:center;min-height:15rem}
.onb h2{font:800 1.875rem/1.15 var(--display);text-align:center;text-wrap:balance}
.onb h2 em{font-style:normal;color:#3a3fe0}
.onb p.lead{color:#3b4470;text-align:center;justify-self:center}
.onb .btn-gold{background:#0b62b5;border-color:#0b62b5;min-height:3.5rem;font-size:1.0625rem;border-radius:22px;box-shadow:0 10px 24px rgba(11,98,181,.3)}
.mock{width:min(17rem,100%);display:grid;gap:.625rem;padding:1rem;border-radius:28px;background:#fff;box-shadow:0 22px 48px rgba(40,70,160,.18);border:6px solid #11163a;transform:rotate(-4deg)}
.mock .mh{border-radius:18px;padding:.875rem;background:linear-gradient(140deg,#2f5bea,#7aa0ff);color:#fff;font:800 1.75rem/1 var(--display)}
.mock .mh small{display:block;font:700 .6875rem var(--ui);opacity:.8;margin-bottom:.375rem}
.mock .mr{display:flex;justify-content:space-between;align-items:center;padding:.5rem .75rem;border-radius:12px;font:700 .8125rem var(--ui);background:#eef3fb}
.mock .mr b{color:#2fa36b}
.mock .mr.r b{color:#e5484d}
.float{position:absolute;padding:.5rem .75rem;border-radius:14px;background:#fff;box-shadow:0 12px 26px rgba(40,70,160,.18);font:800 .8125rem var(--ui);color:#0b1240}

.hero-n.sm{font-size:2rem;line-height:1.1}
.hero-sub{color:var(--hero-mute);position:relative;z-index:1}
.tag.mute{--c:#8d95c0}
.rel{position:relative}
.float.f1{right:-1.5rem;top:1rem}
.mr.txt{display:block;font-weight:600;line-height:1.5}

.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.5rem,1fr));gap:.5rem}
.att{position:relative;min-width:0}
.att a{display:grid;gap:.25rem;align-content:center;justify-items:center;text-align:center;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);color:var(--text);text-decoration:none;padding:.5rem}
.att.img a{padding:0}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att span{font:700 .6875rem/1.2 var(--ui);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.att small{font-size:.625rem;color:var(--mute)}
.att-x{position:absolute;top:.25rem;right:.25rem;width:1.75rem;height:1.75rem;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(5,6,15,.72);color:#fff}
.att-x svg{width:.875rem;height:.875rem}
.tag svg{width:.8125rem;height:.8125rem}
dialog.auth{width:100%;height:100%;margin:0;overflow:auto;color:#f4f6ff;background:radial-gradient(90% 60% at 80% 0%,rgba(52,214,196,.35),transparent 60%),radial-gradient(90% 70% at 10% 15%,#1d2f9e 0%,#0b1033 55%,#05060f 100%)}
dialog.auth::backdrop{background:#05060f}
.auth-in{max-width:28rem;min-height:100%;margin-inline:auto;padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom,0px));display:grid;align-content:start;gap:1.5rem}
.auth-logo{display:flex;align-items:center;gap:.75rem;font:800 1.75rem/1 var(--display)}
.auth-logo .ava{width:3rem;height:3rem;border-radius:14px;box-shadow:none}
.auth-logo .ava svg{width:1.5rem;height:1.5rem}
dialog.auth .h1{font-size:2.125rem;margin-bottom:.375rem}
dialog.auth .muted{color:#a9b0d6}
dialog.auth input{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.18);color:#fff}
dialog.auth .field>label{color:#a9b0d6}
dialog.auth .btn-gold{background:#4b6bfb;border-color:#4b6bfb;min-height:3.5rem;font-size:1.0625rem;border-radius:22px}
.auth-alt{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.auth-alt .link,.auth-foot .link{color:#6f8bff;font-size:1rem}
.or{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.75rem;color:#a9b0d6}
.or::before,.or::after{content:"";height:1px;background:rgba(255,255,255,.18)}
.gbtn{display:flex;justify-content:center;min-height:2.75rem}
.auth-foot{display:grid;gap:.375rem;justify-items:center;text-align:center;margin-top:.5rem}

.modes{display:grid;gap:.625rem}
.mode{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1rem;width:100%;text-align:left;padding:1rem 1.125rem;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--text);transition:transform .12s,border-color .2s}
.mode:hover{border-color:var(--edge)}
.mode:active{transform:scale(.98)}
.mode:disabled{opacity:.5;cursor:default}
.mode>svg{color:var(--mute);width:1.125rem;height:1.125rem}
.mode-ic{width:3rem;height:3rem;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#fff 0%),color-mix(in srgb,var(--c) 75%,#000))}
.mode-ic svg{width:1.5rem;height:1.5rem;stroke-width:2}
.mode-t{display:grid;gap:.125rem;min-width:0}
.mode-t b{font:800 1.0625rem/1.2 var(--display)}
.mode-t small{font-size:.8125rem;color:var(--mute)}
.prog{gap:.875rem}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%;width:0;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.s-new{background:#ff9f43}.s-mid{background:#5a7bff}.s-far{background:#2fd08f}
.prog-l{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;font-size:.75rem;color:var(--mute)}
.prog-l p{display:grid;gap:.125rem}
.prog-l p i{width:.625rem;height:.625rem;border-radius:50%}
.prog-l b{font:800 1.25rem/1 var(--display);color:var(--text)}
.center{text-align:center}
dialog.study{background:var(--bg)}
.st{max-width:40rem;min-height:100%;margin-inline:auto;padding:calc(.75rem + env(safe-area-inset-top,0px)) 1.125rem calc(2rem + env(safe-area-inset-bottom,0px));display:grid;align-content:start;gap:1rem;position:relative}
.st-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.875rem}
.st-mid{display:grid;text-align:center;min-width:0}
.st-mid b{font:800 1.0625rem/1.2 var(--display)}
.st-mid small{font-size:.75rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-n{font:800 .9375rem var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:2.75rem;text-align:right}
.fc-counts{display:flex;justify-content:space-between;align-items:center}
.fc-no,.fc-yes{min-width:2.75rem;height:2rem;border-radius:999px;display:grid;place-items:center;font:800 .9375rem var(--ui);border:1.5px solid}
.fc-no{color:#ff9f43;border-color:#ff9f43}.fc-yes{color:#2fd08f;border-color:#2fd08f}
.fc-stage{perspective:1400px}
.fc{position:relative;height:min(58vh,26rem);cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .25s}
.fc.drag{transition:none}
.fc-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;background:var(--card2);border:1.5px solid var(--line);display:grid;grid-template-rows:auto 1fr auto;padding:1.25rem;box-shadow:var(--shadow)}
.fc-back{transform:rotateY(180deg);background:color-mix(in srgb,var(--pri) 12%,var(--card2))}
.fc-face small{font:800 .75rem var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.fc-face p{align-self:center;text-align:center;font:800 1.75rem/1.3 var(--display);overflow-wrap:anywhere;overflow:auto;max-height:100%;white-space:pre-wrap}
.fc-face p.long{font:600 1.0625rem/1.55 var(--ui);text-align:left}
.fc-face em{font-style:normal;text-align:center;font-size:.8125rem;color:var(--mute)}
.fc-tag{position:absolute;pointer-events:none;top:1.25rem;padding:.375rem .75rem;border-radius:10px;font:800 .875rem var(--ui);letter-spacing:.06em;opacity:0;transition:opacity .15s;border:2px solid}
.fc-tag.no{right:1.25rem;color:#ff9f43;border-color:#ff9f43;transform:rotate(8deg)}
.fc-tag.yes{left:1.25rem;color:#2fd08f;border-color:#2fd08f;transform:rotate(-8deg)}
.fc.lean-r .fc-tag.yes,.fc.lean-l .fc-tag.no{opacity:1}
.fc.lean-r .fc-face{border-color:#2fd08f}.fc.lean-l .fc-face{border-color:#ff9f43}
.fc.out-r{transform:translateX(130%) rotate(18deg)!important;opacity:0;transition:transform .22s ease-in,opacity .22s}
.fc.out-l{transform:translateX(-130%) rotate(-18deg)!important;opacity:0;transition:transform .22s ease-in,opacity .22s}
.fc-ctl{display:grid;grid-template-columns:4rem minmax(0,1fr) 4rem;gap:.75rem;align-items:center}
.fc-btn{height:4rem;border-radius:22px;border:1.5px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;font:800 .9375rem var(--ui)}
.fc-btn svg{width:1.5rem;height:1.5rem;stroke-width:2.4}
.fc-btn.no{color:#ff9f43;border-color:color-mix(in srgb,#ff9f43 50%,transparent)}
.fc-btn.yes{color:#2fd08f;border-color:color-mix(in srgb,#2fd08f 50%,transparent)}
.fc-btn:active{transform:scale(.94)}
.ln{display:grid;gap:1rem}
.ln-kind{font:800 .8125rem var(--ui);color:var(--mute);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.ln-q{font:800 1.625rem/1.3 var(--display);overflow-wrap:anywhere;white-space:pre-wrap;padding:1.25rem;border-radius:24px;background:var(--card2);border:1px solid var(--line)}
.opts{display:grid;gap:.625rem}
.opts.two{grid-template-columns:1fr 1fr}
.aopt{display:flex;align-items:center;gap:.875rem;width:100%;text-align:left;padding:.875rem 1rem;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:700 1rem/1.4 var(--ui);cursor:pointer;transition:transform .12s,border-color .15s,background-color .15s}
.aopt:active{transform:scale(.98)}
.aopt span:last-child{overflow-wrap:anywhere;min-width:0}
.opt-k{flex:none;width:1.75rem;height:1.75rem;border-radius:9px;display:grid;place-items:center;background:var(--chip);font:800 .8125rem var(--ui);color:var(--mute)}

<script>
(() => {
"use strict";
document.documentElement.lang = "uz";
const APP = () => `ME'MORI ${new Date().getFullYear()}`;
document.title = APP();

/* ── core: dates and the ladder (pure) ── */
const LADDER = [1, 3, 7, 14, 30, 60, 120, 240];   // days until the next review; one step up per successful recall
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
// g: 0 forgot (back to the first step), 1 hard (same step again), 2 recalled (one step up), 3 easy (two steps up)
function graded(it, g, day) {
  const s = g === 3 ? Math.min(it.s + 2, LADDER.length - 1) : g === 2 ? Math.min(it.s + 1, LADDER.length - 1) : g === 1 ? it.s : 0;
  return { ...it, s, d: addDays(day, LADDER[s]), n: (it.n || 0) + 1, l: (it.l || 0) + (g === 0 ? 1 : 0), h: [...(it.h || []), [day, g]].slice(-60) };
}
function inDays(n) {
  if (n < 0) return `${-n} kun kechikdi`;
  if (n === 0) return "bugun";
  if (n === 1) return "ertaga";
  if (n < 28) return n % 7 === 0 ? `${n / 7} haftadan keyin` : `${n} kundan keyin`;
  return `${Math.max(1, Math.round(n / 30))} oydan keyin`;
}
// FSRS (default FSRS-4.5 weights): stability S in days, difficulty D 1..10, recall probability R.
// Grades map to Again, Hard, Good, Easy; the next review is set where R falls to 90%, which is t = S.
const FW = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
const clampD = d => Math.min(10, Math.max(1, d));
function fsrsNext(it, g, day) {
  const G = g + 1, h = it.h || [];
  let S = it.S, D = it.D;
  if (!S && !it.n) { S = FW[G - 1]; D = clampD(FW[4] - (G - 3) * FW[5]); }
  else {
    if (!S) { S = LADDER[it.s || 0]; D = 5; }             // a note that grew up on the ladder
    const last = it.lr || (h.length ? h[h.length - 1][0] : day);
    const R = Math.pow(1 + Math.max(0, diffDays(day, last)) / (9 * S), -1);
    D = clampD(FW[7] * FW[4] + (1 - FW[7]) * (D - FW[6] * (G - 3)));
    S = G === 1 ? FW[11] * Math.pow(D, -FW[12]) * (Math.pow(S + 1, FW[13]) - 1) * Math.exp(FW[14] * (1 - R))
      : S * (Math.exp(FW[8]) * (11 - D) * Math.pow(S, -FW[9]) * (Math.exp(FW[10] * (1 - R)) - 1) * (G === 2 ? FW[15] : G === 4 ? FW[16] : 1) + 1);
  }
  const days = G === 1 ? 1 : Math.min(1095, Math.max(1, Math.round(S)));
  let s = 0; while (s < LADDER.length - 1 && LADDER[s + 1] <= days) s++;
  return { ...it, S: +S.toFixed(3), D: +D.toFixed(3), lr: day, s, d: addDays(day, days), n: (it.n || 0) + 1, l: (it.l || 0) + (g === 0 ? 1 : 0), h: [...h, [day, g]].slice(-60) };
}
/* ── end core ── */

const STEP = [["1", "kun"], ["3", "kun"], ["1", "hafta"], ["2", "hafta"], ["1", "oy"], ["2", "oy"], ["4", "oy"], ["8", "oy"]];
const LONG = 4;   // from the one-month step on, a note counts as long-term
const UNITS = {
  bet: { one: "bet", many: "betlar", from: "Qaysi betdan", to: "Qaysi betgacha" },
  dars: { one: "dars", many: "darslar", from: "Qaysi darsdan", to: "Qaysi darsgacha" },

    cloud.sizes[doc.id] = bytes(data);

/* ── own server (Render + Neon): used when the page is opened from its own site ──
   Inside Claude the page keeps using the account database above; a copy served by the
   Esda qolsin server signs in and syncs with /api instead. */
const SINCE = "esda-qolsin:since", UIDK = "esda-qolsin:uid";
const syncing = () => cloud.mode === "on" || cloud.mode === "srv";
async function api(path, body, method) {
  let r;
  try { r = await fetch(path, { method: method || (body ? "POST" : "GET"), headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin", cache: "no-store" }); }
  catch (e) { throw { status: 0, msg: "Internet yoki server bilan aloqa yo'q." }; }
  let j = null;
  try { j = await r.json(); } catch (e) { /* not JSON */ }
  if (!r.ok) throw { status: r.status, msg: (j && j.error) || "Server javob bermadi." };
  return j;
}
async function detectServer() {
  if (!/^https?:$/.test(location.protocol)) return false;
  try { const r = await fetch("/api/health", { cache: "no-store" }); const j = r.ok ? await r.json() : null; return !!(j && j.app === "esda-qolsin"); }
  catch (e) { return false; }
}
async function startServer() {
  cloud.mode = "srv"; cloud.conf = {};
  setSync("connecting");
  try { cloud.conf = await api("/api/config"); } catch (e) { /* defaults */ }
  try { signedIn(await api("/api/me")); }
  catch (e) {
    if (e.status === 401) openAuth("login");
    else { setSync("error"); cloud.ready = true; if (cloud.me == null && localStorage.getItem(UIDK)) { cloud.me = { name: "" }; } }
  }
}
function signedIn(me) {
  cloud.me = { id: me.id, name: me.name || me.email.split("@")[0], email: me.email, avatarUrl: me.picture || "" };
  try {
    const prev = localStorage.getItem(UIDK);
    if (prev && prev !== me.id) { recs = {}; pageOf = {}; localStorage.removeItem(SINCE); saveLocal(true); }   // another person signed in on this browser
    localStorage.setItem(UIDK, me.id);
    cloud.since = +localStorage.getItem(SINCE) || 0;
  } catch (e) { cloud.since = 0; }
  cloud.mode = "srv"; cloud.ready = true;
  if (!cloud.since) for (const id in recs) cloud.dirty.add(id);     // first sign-in here: what this browser holds joins the account
  const wasOpen = $("#auth").open;
  closeAuth(); render(); srvSync(); linkReturn();
  if (wasOpen) tourLater();
  clearInterval(cloud.poll);
  cloud.poll = setInterval(() => { if (document.visibilityState === "visible") srvSync(); }, 45000);
}
async function srvSync() {
  if (cloud.busy || !cloud.ready || cloud.mode !== "srv" || !cloud.me || !cloud.me.id) return;
  cloud.busy = true; setSync("saving");
  const send = [...cloud.dirty].map(id => recs[id]).filter(Boolean);
  try {
    const r = await api("/api/sync", { since: cloud.since, recs: send });
    for (const x of send) if (recs[x.id] === x) cloud.dirty.delete(x.id);
    let changed = false;
    for (const t of r.recs || []) {
      const mine = recs[t.id];
      if (!mine || (t.u || 0) > (mine.u || 0)) { const n = norm(t); if (n) { recs[n.id] = n; changed = true; } }
    }
    cloud.since = r.since || cloud.since;
    try { localStorage.setItem(SINCE, String(cloud.since)); } catch (e) { /* re-read next time */ }
    cloud.fails = 0; cloud.busy = false; saveLocal();
    if (changed) render();
    if (location.hash === "#takror") { try { history.replaceState(null, "", location.pathname); } catch (e) { /* stays */ } if (dueItems(today()).length && !$("#review").open) startReview("all"); }
    if (cloud.dirty.size) scheduleFlush(); else setSync("synced");
  } catch (e) {
    cloud.busy = false;
    if (e.status === 401) { cloud.me = null; return openAuth("login"); }
    cloud.fails++; setSync("error");
    if (cloud.fails <= 3) scheduleFlush([0, 3000, 10000, 30000][cloud.fails]);
  }
}
async function signOut() {
  try { await api("/api/auth/logout", {}); } catch (e) { /* the cookie expires anyway */ }
  recs = {}; pageOf = {}; cloud.mode = "off"; clearInterval(cloud.poll);   // nothing of this account stays in the browser, even when the page saves on leaving
  try { for (const k of Object.keys(localStorage)) if (k.startsWith("esda-qolsin:") && k !== SKIN && k !== ONB_KEY) localStorage.removeItem(k); } catch (e) { /* nothing stored */ }
  location.reload();
}

/* XOTIR is what is in memory right now, as so'm is what is in the wallet.
   Every note or card is worth 10 XOTIR once it has been recalled in a review at least once
   (until then it is «kutilmoqda»). After that it counts by the chance it is still remembered:
   R = (1 + t / 9S)^-1, t days since the last review, S the gap of its ladder step (FSRS's curve).
   A review brings it back to 10 and the next decline is slower. «Unutdim» drops it to 0 until it
   is recalled again, so an honest answer is never punished beyond the truth.
   Pages, lessons and minutes are effort: they are reported, not counted as XOTIR. */
const XV = 10;
const recallP = (t, S) => Math.pow(1 + Math.max(0, t) / (9 * S), -1);
function tlOf(i) {
  const steps = [], ev = [];
  let proven = false, s = 0, last = "";
  for (const [d, g] of i.h) {
    const before = proven ? XV * recallP(diffDays(d, last), LADDER[s]) : 0;
    if (g >= 1) { ev.push([d, XV - before, 0, g]); proven = true; s = g === 3 ? Math.min(s + 2, LADDER.length - 1) : g === 2 ? Math.min(s + 1, LADDER.length - 1) : s; }
    else { ev.push([d, 0, before, 0]); proven = false; s = 0; }
    last = d; steps.push([d, proven, s, last]);
  }
  return { steps, ev };
}
let XC = null;   // the timelines, rebuilt after every change
const xbook = () => XC || (XC = items().filter(i => !i.rev).map(i => ({ i, tl: tlOf(i) })));
function valueOn(tl, D) {
  let st = null;
  for (const x of tl.steps) { if (x[0] <= D) st = x; else break; }
  return st && st[1] ? XV * recallP(diffDays(D, st[3]), LADDER[st[2]]) : 0;
}
const balanceOn = D => xbook().reduce((n, x) => n + valueOn(x.tl, D), 0);
// Earned (reviews), forgotten («Unutdim») and faded (time) over a range of days, both ends included.
function flows(from, to) {
  const b0 = balanceOn(addDays(from, -1)), b1 = balanceOn(to);
  let gain = 0, lost = 0, reviews = 0;
  for (const x of xbook()) for (const [d, g, l] of x.tl.ev) if (d >= from && d <= to) { gain += g; lost += l; reviews++; }
  const net = b1 - b0;
  return { gain: Math.round(gain), lost: Math.round(lost), fade: Math.max(0, Math.round(gain - lost - net)), net: Math.round(net), bal: Math.round(b1), reviews };
}
const pendingOf = () => xbook().filter(x => !x.i.off && !(x.tl.steps.length && x.tl.steps[x.tl.steps.length - 1][1]));
function perRange(per, day) {
  if (per === "all") { const f = items().reduce((m, i) => Math.min(m, i.c || Infinity), Infinity); return [isFinite(f) ? dayOf(f) : day, day]; }
  const [y, m] = per.split("-").map(Number), end = `${per}-${pad(new Date(y, m, 0).getDate())}`;
  return [`${per}-01`, end < day ? end : day];
}

    <p><b>10 XOTIR</b> har bir yozuv yoki karta. U birinchi takrorda eslaganingizda hisobga tushadi, shungacha «kutilmoqda».</p>
    <p><b>Vaqt o'tishi bilan</b> esda qolish ehtimoli kamayadi, XOTIR ham shunga yarasha kamayadi. Takrorlasangiz, yana 10 ga chiqadi va keyingi safar sekinroq kamayadi.</p>
    <p><b>«Unutdim»</b> jarima emas: yozuv qayta eslanguncha 0 turadi. Halol baho bersangiz, ilova uni tezroq qaytarib so'raydi.</p>
    <p><b>Bet, dars va vaqt</b> harakat hisobi: hisobotda ko'rinadi, lekin XOTIR bermaydi. O'qish hali bilish degani emas.</p></div></details>`;

// The ledger: reviews earn XOTIR, notes wait for their first recall, sessions are effort.
function reviewDays(from) {

}

    return `<div class="day-h"><b>${d === day ? "Bugun" : d === addDays(day, -1) ? "Kecha" : fmtDate(d)}, ${WEEKDAYS[parse(d).getDay()]}</b>${r && r.gain - r.lost ? `<span class="${r.gain - r.lost > 0 ? "up" : "down"}">${r.gain - r.lost > 0 ? "+" : "−"}${nf(Math.abs(Math.round(r.gain - r.lost)))} XOTIR</span>` : ""}</div>
    <div class="ledger-list">${es.map(e => { if (e.k === "r") return `<button type="button" class="lrow" data-act="tab" data-tab="journal"><span class="tile c-green">${ic("learn")}</span><span class="lrow-t"><b>Takror: ${e.n} ta</b><small>${e.forgot ? `${e.forgot} tasi unutildi` : "hammasi eslandi"}</small></span><span class="lrow-x${Math.round(e.gain - e.lost) < 0 ? " neg" : Math.round(e.gain - e.lost) ? "" : " wait"}">${Math.round(e.gain - e.lost) < 0 ? "−" : Math.round(e.gain - e.lost) ? "+" : ""}${nf(Math.abs(Math.round(e.gain - e.lost)))}<small>XOTIR</small></span></button>`;

// Big numbers count up once when a screen opens.
function countUp(root) {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (const el of root.querySelectorAll("[data-count]")) {
    const to = +el.dataset.count, t0 = performance.now(), node = el.firstChild;
    if (!node || !to) continue;
    const step = t => { const k = Math.min(1, (t - t0) / 650), v = Math.round(to * (1 - Math.pow(1 - k, 3))); node.nodeValue = nf(v); if (k < 1) requestAnimationFrame(step); };

}

function xChart(day) {

    return `<g><title>${fmtDate(ds[k])}: +${x.kirim} / −${x.chiqim} XOTIR</title>${hp ? `<rect class="kp" x="${cx.toFixed(1)}" y="${(base - hp).toFixed(1)}" width="${(w - 6).toFixed(1)}" height="${hp.toFixed(1)}" rx="3"/>` : ""}${hn ? `<rect class="kn" x="${cx.toFixed(1)}" y="${(base + 1).toFixed(1)}" width="${(w - 6).toFixed(1)}" height="${hn.toFixed(1)}" rx="3"/>` : ""}<text x="${(cx + (w - 6) / 2).toFixed(1)}" y="${H + 14}">${parse(ds[k]).getDate()}</text></g>`; }).join("");

    <svg viewBox="0 0 300 ${H + 18}" role="img" aria-label="So'nggi 14 kunda +${sum.k} va −${sum.c} XOTIR"><line x1="0" x2="300" y1="${base.toFixed(1)}" y2="${base.toFixed(1)}" class="axis"/>${bars}</svg></section>`;
}

// Notes by kind of note, as a donut with a legend.
function donut(its) {
  const C = 2 * Math.PI * 42, parts = Object.keys(TYPES).map(t => [t, its.filter(i => i.t === t).length]).filter(x => x[1]);
  const tot = parts.reduce((n, x) => n + x[1], 0);
  if (!tot) return "";
  const COL = { blue: "#5a7bff", green: "#2fd08f", purple: "#a07bff", orange: "#ff9f43", teal: "#22c7c7", pink: "#ff6fae" };
  let acc = 0;
  const arcs = parts.map(([t, n]) => { const len = n / tot * C, off = -acc; acc += len; return `<circle cx="50" cy="50" r="42" stroke="${COL[TYPE_COLOR[t]]}" stroke-dasharray="${Math.max(0, len - 1.5).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"></circle>`; }).join("");
  return `<section class="card sec"><h2 class="h2">Usullar bo'yicha yozuvlar</h2>
    <div class="donut-wrap"><div class="donut" role="img" aria-label="${parts.map(([t, n]) => `${TYPES[t]} ${n}`).join(", ")}"><svg viewBox="0 0 100 100">${arcs}</svg><b>${tot}<small>yozuv</small></b></div>
    <div class="legend">${parts.map(([t, n]) => `<p class="c-${TYPE_COLOR[t]}"><i></i>${TYPES[t]}<span>${Math.round(n / tot * 100)}%</span></p>`).join("")}</div></div></section>`;
}

function knowledgeMap() {
  const bs = books();
  const edges = new Map();
  for (const i of items()) if (i.t === "link" && i.x && i.x !== i.b && recs[i.x] && !recs[i.x].del) { const k = [i.b, i.x].sort().join("|"); edges.set(k, (edges.get(k) || 0) + 1); }
  if (bs.length < 2 || !edges.size) return `<p class="muted small">Manbalar bir-biriga bog'langanda shu yerda tarmoq paydo bo'ladi. «O'rgandim» oynasidagi «Nimaga bog'lanadi?» bo'limida boshqa manbani tanlang.</p>`;
  const W = 360, H = 300, cx = W / 2, cy = H / 2, R = 96, pos = {};
  bs.forEach((b, k) => { const t = 2 * Math.PI * k / bs.length - Math.PI / 2; pos[b.id] = [cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t)]; });
  const cut = t => t.length > 16 ? t.slice(0, 15) + "…" : t;
  const lines = [...edges].map(([k, n]) => { const [a, b] = k.split("|"), p = pos[a], q = pos[b]; return p && q ? `<line class="edge" x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke-width="${Math.min(6, 1 + n)}"></line>` : ""; }).join("");
  const dots = bs.map(b => { const [x, y, c] = pos[b.id], n = itemsOf(b.id).length, side = c > 0.2 ? "start" : c < -0.2 ? "end" : "middle", dx = side === "start" ? 12 : side === "end" ? -12 : 0, dy = side === "middle" ? (y < cy ? -14 : 22) : 4;
    return `<circle class="node" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${Math.min(12, 5 + n / 2).toFixed(1)}"></circle><text class="lbl" x="${(x + dx).toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${side}">${esc(cut(b.title))}</text>`; }).join("");
  return `<div class="map-wrap"><svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Manbalar orasidagi bog'lanishlar: ${edges.size} ta">${lines}${dots}</svg></div><p class="small muted">Chiziq qalinligi bog'lanishlar soni, doira kattaligi manbadagi yozuvlar soni.</p>`;
}

async function linkReturn() {
  const m = /[#&]link=([^&]+)&from=([a-z]+)/.exec(location.hash);
  if (!m) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { location.hash = ""; }
  const code = decodeURIComponent(m[1]), from = m[2];
  if (from !== "vaqt") return toast("Bu kod ME'MORI uchun emas.");
  try { await api("/api/links", { app: from, code }); toast("Vaqt Banki ulandi. O'qish va takror vaqti endi o'zi yoziladi."); sheetLinks("key"); }
  catch (e) { toast(e.msg || "Ulab bo'lmadi."); }
}

/* flashcards */
/* text to speech: the browser's own voices; the language is guessed from the script and the source */
const TTS = "esda-qolsin:tts";

const canSay = () => "speechSynthesis" in window && ttsOn();
function langOf(text, bid) {
  if (/[\u0600-\u06ff]/.test(text)) return "ar-SA";
  if (/[\u0400-\u04ff]/.test(text)) return /[ўқғҳ]/i.test(text) ? "uz-UZ" : "ru-RU";
  if (/[ğşçıİ]/.test(text)) return "tr-TR";
  if (/[äöüß]/i.test(text)) return "de-DE";
  if (/[éèêàçœ]/i.test(text)) return "fr-FR";
  if (/[ñ¿¡]/.test(text)) return "es-ES";
  const b = recs[bid];
  if (/o['ʻ‘’`]|g['ʻ‘’`]|\b(va|bu|bilan|uchun|emas|nima|qanday)\b/i.test(text)) return "uz-UZ";
  return b && b.kind === "til" ? "en-US" : "uz-UZ";
}
function say(text, bid) {

  const u = new SpeechSynthesisUtterance(String(text).replace(/\[\[|\]\]/g, "").slice(0, 400)), lang = langOf(text, bid);
  const vs = speechSynthesis.getVoices(), v = vs.find(x => x.lang.replace("_", "-") === lang) || vs.find(x => x.lang.slice(0, 2) === lang.slice(0, 2));

}
const sayBtn = (text, bid) => canSay() && text ? `<button type="button" class="say" data-act="say" data-t="${esc(text)}" data-b="${esc(bid || "")}" aria-label="Ovoz chiqarib o'qish">${ic("sound")}</button>` : "";

/* learn: choose first, then write */
function learnPick() {
  if (!st.q.length) return null;
  const p = st.pool.find(x => x.id === st.q[0]), lvl = st.lvl[p.id];
  const kind = lvl === 0 && st.pool.length >= 2 ? "mcq" : "write";
  let opts = [];
  if (kind === "mcq") {
    const others = shuffle([...new Set(st.pool.filter(x => x.id !== p.id && fold(x.k) !== fold(p.k)).map(x => x.k))]).slice(0, 3);
    opts = shuffle([p.k, ...others]);

}

      st.qs.filter(q => !q.ok).map(q => `<div class="fb bad"><b>${esc(q.p.f)}</b><p><span class="muted">To'g'ri javob:</span> ${esc(q.p.k)}</p>${q.typed ? `<p class="small"><span class="muted">Siz:</span> ${esc(q.typed)}</p>` : ""}</div>`).join(""),

      <p class="tq-q">${esc(q.p.f)}</p>

        : q.kind === "tf" ? `<p class="tq-claim"><span class="muted">Javob:</span> ${esc(q.claim)}</p><div class="opts two"><label class="aopt"><input class="vh" type="radio" name="q${n}" value="1"><span>To'g'ri</span></label><label class="aopt"><input class="vh" type="radio" name="q${n}" value="0"><span>Noto'g'ri</span></label></div>`

function buildTest(n, kinds) {
  const pick = shuffle(st.sp).slice(0, n), all = st.sp;
  st.qs = pick.map((p, i) => {
    let kind = kinds[i % kinds.length];
    if (kind !== "wr" && all.length < 2) kind = "wr";
    if (kind === "mcq") { const others = shuffle([...new Set(all.filter(x => x.id !== p.id && fold(x.k) !== fold(p.k)).map(x => x.k))]).slice(0, 3); return { p, kind, opts: shuffle([p.k, ...others]) }; }
    if (kind === "tf") { const wrong = shuffle(all.filter(x => x.id !== p.id && fold(x.k) !== fold(p.k)))[0]; const truth = !wrong || Math.random() < 0.5; return { p, kind, truth, claim: truth ? p.k : wrong.k }; }

/* match */
function startMatch() {
  const pool = shuffle(st.sp.filter(p => p.f.length <= 70 && p.k.length <= 70));
  const pairs = (pool.length >= 3 ? pool : shuffle(st.sp)).slice(0, 6);
  st.tiles = shuffle(pairs.flatMap(p => [{ id: p.id, side: "f", text: p.f }, { id: p.id, side: "k", text: p.k }]));
  st.left = pairs.length; st.sel = null; st.t0 = performance.now(); st.pen = 0; st.end = 0;
  paintStudy(); tickMatch();
}
function tickMatch() {
  const el = $("#mt-time");
  if (!st || st.mode !== "match" || st.end || !el) return;
  el.textContent = ((performance.now() - st.t0) / 1000 + st.pen).toFixed(1);
  requestAnimationFrame(tickMatch);
}
const BEST = "esda-qolsin:match:";
function paintMatch() {
  if (!st.tiles) return studyTop("", 0);
  if (st.end) {
    let best = 0; try { best = +localStorage.getItem(BEST + st.bid) || 0; } catch (e) { /* none */ }
    const t = st.end, rec = !best || t < best;
    if (rec) try { localStorage.setItem(BEST + st.bid, String(t)); } catch (e) { /* not kept */ }
    return studyTop(`${t.toFixed(1)} s`, 100) + finishScreen(`${t.toFixed(1)} soniya`, rec ? "Yangi rekord!" : `Eng yaxshi natijangiz: ${best.toFixed(1)} s`, "",
      `<button type="button" class="btn btn-gold" data-act="mt-again" data-focus>Yana o'ynash</button><button type="button" class="btn" data-act="st-close">Yopish</button>`, rec);
  }
  return `${studyTop(`<span id="mt-time">0.0</span> s`, Math.round((1 - st.left / (st.tiles.length / 2)) * 100))}
    <p class="small muted center">Savol va uning javobini bosib, juftlarni toping. Xato uchun +1 soniya.</p>
    <div class="mt">${st.tiles.map((t, j) => `<button type="button" class="mtile${t.gone ? " gone" : ""}${st.sel === j ? " sel" : ""}${t.side === "k" ? " ans" : ""}" data-act="mt-tile" data-j="${j}"${t.gone ? " disabled" : ""}>${esc(t.text)}</button>`).join("")}</div>`;
}
function matchTap(j) {
  const t = st.tiles[j]; if (!t || t.gone || st.end) return;
  const btns = document.querySelectorAll(".mt .mtile");
  if (st.sel == null) { st.sel = j; btns[j].classList.add("sel"); return; }
  if (st.sel === j) { st.sel = null; btns[j].classList.remove("sel"); return; }
  const a = st.tiles[st.sel];
  if (a.id === t.id && a.side !== t.side) {
    a.gone = t.gone = true; btns[st.sel].classList.add("hit"); btns[j].classList.add("hit"); buzz(10);
    const s = st.sel; st.sel = null; st.left--;
    setTimeout(() => { btns[s].classList.add("gone"); btns[j].classList.add("gone"); btns[s].disabled = btns[j].disabled = true; }, 260);
    if (!st.left) { st.end = (performance.now() - st.t0) / 1000 + st.pen; setTimeout(paintStudy, 380); }
  } else {
    st.pen += 1; buzz([30, 40, 30]);
    const s = st.sel; st.sel = null;
    btns[s].classList.remove("sel"); btns[s].classList.add("miss"); btns[j].classList.add("miss");
    setTimeout(() => { btns[s].classList.remove("miss"); btns[j].classList.remove("miss"); }, 420);
  }
}

/* a short burst of confetti for finished rounds */
function confetti() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const host = $("#study"); if (!host || !host.open) return;
  const c = document.createElement("canvas"); c.className = "confetti"; host.append(c);
  const W = c.width = host.clientWidth * devicePixelRatio, H = c.height = host.clientHeight * devicePixelRatio, x = c.getContext("2d");
  const COLS = ["#33d6c4", "#4b6bfb", "#5a3ff0", "#f6b73c", "#ff6fae", "#2fd08f"];
  const ps = Array.from({ length: 140 }, () => ({ x: W / 2, y: H * 0.35, vx: (Math.random() - 0.5) * 22 * devicePixelRatio, vy: (-Math.random() * 18 - 6) * devicePixelRatio, r: (4 + Math.random() * 5) * devicePixelRatio, c: COLS[Math.floor(Math.random() * COLS.length)], a: Math.random() * 6 }));
  let f = 0;
  const step = () => {
    x.clearRect(0, 0, W, H);
    for (const p of ps) { p.vy += 0.55 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.vx *= 0.985; p.a += 0.2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); }
    if (++f < 110) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}

/* many cards at once: one "term — meaning" per line */
function parseBulk(text) {
  const out = [];
  for (const line of text.split(/\r?\n/)) {
    const l = line.trim(); if (!l) continue;
    const m = /\t| [—–-] |\s*=\s*|: /.exec(l);
    if (!m) continue;
    const q = l.slice(0, m.index).trim(), a = l.slice(m.index + m[0].length).trim();
    if (q && a) out.push([q.slice(0, 400), a.slice(0, 4000)]);
  }
  return out;
}

}

function addRt(root) {
  let n = 0;
  for (const t of root.querySelectorAll("textarea[data-grow]:not(.no-rt)")) {
    if (["chat-in", "bl-text", "cp-text", "rs-text"].includes(t.id) || t.previousElementSibling && t.previousElementSibling.classList.contains("rt")) continue;
    if (!t.id) t.id = "rt-" + (++n) + "-" + Date.now().toString(36);

function rtApply(el) {
  const t = $("#" + el.dataset.t); if (!t) return;
  const k = el.dataset.k, b = RT_BTNS.find(x => x[0] === k), s0 = t.selectionStart, s1 = t.selectionEnd, sel = t.value.slice(s0, s1);
  let pre, post;
  if (k === "c") { pre = `{${el.dataset.c}|`; post = "}"; }
  else { pre = b[3]; post = b[4]; }
  if (k === "h" || k === "q") {
    const ls = t.value.lastIndexOf("\n", s0 - 1) + 1;
    if (t.value.startsWith(pre, ls)) t.setRangeText("", ls, ls + pre.length, "end"); else t.setRangeText(pre, ls, ls, "end");

    t.setRangeText(pre + word + post, s0, s1, "end");
    if (k === "l") { const p = s0 + pre.length + word.length + 2; t.setSelectionRange(p, p + 8); }
    else t.setSelectionRange(s0 + pre.length, s0 + pre.length + word.length);   // the word stays selected, so a second style wraps it too
  }

}

function interleave(list) {

    st.qs.forEach((q, n) => { const v = fd.get("q" + n);
      if (q.kind === "mcq") { q.typed = v == null ? "" : q.opts[+v]; q.ok = q.typed === q.p.k; }
      else if (q.kind === "tf") { q.typed = v == null ? "" : v === "1" ? "To'g'ri" : "Noto'g'ri"; q.ok = v != null && (v === "1") === q.truth; }
      else { q.typed = str(v).trim(); q.ok = !!q.typed && sameAnswer(q.typed, q.p.k); } });
    st.result = { right: st.qs.filter(q => q.ok).length, total: st.qs.length }; paintStudy(); $("#study").scrollTop = 0;
  },
  bulk(form) {
    const b = recs[form.dataset.id]; if (!b) return closeSheet();
    const fd = new FormData(form), rows = parseBulk(str(fd.get("bulk"))), two = fd.get("two") === "1";
    if (!rows.length) return fail(form, "Kartochka topilmadi. Har qatorda savol va javobni « — » bilan ajrating.");
    const now = Date.now(), due = addDays(today(), LADDER[0]), out = [];
    rows.forEach(([q, a], k) => { out.push({ id: uid(), k: "i", b: b.id, t: "card", q, a, r: "", f: 0, e: 0, c: now + out.length, s: 0, d: due, n: 0, l: 0, h: [] }); if (two) out.push({ id: uid(), k: "i", b: b.id, t: "card", q: a, a: q, r: "", f: 0, e: 0, c: now + out.length, s: 0, d: due, n: 0, l: 0, h: [], rev: 1 }); });
    put(out); closeSheet(); toast(`${rows.length} ta kartochka qo'shildi: har biri birinchi eslanganda +${XV} XOTIR. Endi «Kartochkalar» yoki «Moslashtirish» bilan mashq qiling.`);
  },
  async auth(form) {
    const fd = new FormData(form), reg = form.dataset.m === "reg", btn = form.querySelector("button[type=submit]");
    const email = str(fd.get("email")).trim(), password = str(fd.get("password"));
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail(form, "Email manzilini to'g'ri yozing.");
    if (password.length < 8) return fail(form, "Parol kamida 8 belgidan iborat bo'lsin.");
    btn.disabled = true;
    try { signedIn(await api(reg ? "/api/auth/register" : "/api/auth/login", { email, password, name: str(fd.get("name")).trim() })); }
    catch (e) { fail(form, e.msg); }
    finally { btn.disabled = false; }
  },
  goal(form) {
    const fd = new FormData(form), id = form.dataset.id, target = int(fd.get("target"));
    if (!target) return fail(form, "Maqsad sonini yozing.");
    const g = { ...(id && recs[id] ? recs[id] : { id: uid(), k: "g", c: Date.now() }), metric: str(fd.get("metric")) || "notes", period: fd.get("period") === "year" ? "year" : "month", target, title: str(fd.get("title")).trim() };
    put(g); closeSheet(); toast("Maqsad saqlandi.");
  },
  async gloss(form) {
    const fd = new FormData(form), w = str(fd.get("w")).trim().replace(/\s+/g, " "), ctx = str(fd.get("c")).trim();
    if (!w) return fail(form, "So'zni yozing.");
    asst.word = w; asst.ctx = ctx; asst.b = str(fd.get("b"));
    const b = recs[asst.b];
    if (!aiOn()) { asst.ans = { w, m: "", x: "", t: "", ctx }; paintAssistant(); const m = $("#gl-m"); if (m) m.focus(); return; }
    if (asst.busy) return;
    asst.busy = true; paintAssistant();
    try { asst.ans = { ...(await glossAsk(w, ctx, b ? b.title : "")), ctx }; }
    catch (e) { asst.ans = { w, m: "", x: "", t: "", ctx }; toast(e && e.msg ? e.msg : "AI javob bermadi. Ma'nosini o'zingiz yozib saqlashingiz mumkin."); }
    finally { asst.busy = false; }
    paintAssistant();
  },
  "gloss-save"(form) {
    const fd = new FormData(form), a = asst.ans; if (!a) return;
    const m = str(fd.get("m")).trim(); if (!m) return fail(form, "Ma'nosini yozing.");
    const upd = glossSave({ ...a, m, x: str(fd.get("x")).trim() }, recs[asst.b]);
    toast(upd ? `«${a.w}» yangilandi.` : `«${a.w}» lug'atga qo'shildi. Ertaga takrorda so'raladi.`);
    asst.ans = null; asst.word = ""; asst.ctx = "";
    render(); paintAssistant(); const w = $("#gl-w"); if (w) w.focus();
  },
  chat(form) {
    const t = $("#chat-in"), m = str(t.value).trim();
    if (!m || chat.busy) return;
    chat.turns.push({ role: "user", content: m });
    bubble(m, true); t.value = ""; grow(t);
    askChat();
  },
  restore(form) {
    const fd = new FormData(form), file = fd.get("file"), text = str(fd.get("text")).trim();
    if (file && file.size) {
      const fr = new FileReader();
      fr.onload = () => restoreFrom(str(fr.result), form);
      fr.onerror = () => fail(form, "Fayl o'qilmadi. Boshqa faylni tanlab ko'ring.");
      fr.readAsText(file);
    } else if (text) restoreFrom(text, form);
    else fail(form, "Zaxira faylini tanlang yoki matnini joylang.");
  },
};

/* ── wiring ── */
let downOnBackdrop = false;
document.addEventListener("pointerdown", e => { downOnBackdrop = e.target.id === "sheet"; });
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el) { const fn = act[el.dataset.act]; if (fn) fn(el, e); return; }
  if (e.target.id === "sheet" && downOnBackdrop) closeSheet();   // a tap on the dimmed area
});
document.addEventListener("submit", e => { e.preventDefault(); const fn = forms[e.target.dataset.form]; if (fn) fn(e.target); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches && t.matches("textarea[data-grow]")) grow(t);
  const f = t.closest && t.closest('form[data-form="read"]');
  if (f) queueDraft(f);
  if (t.id === "mj-in") $("#mj-out").textContent = majorOut(t.value);
  if (t.id === "q-in") searchOut(t.value);
  if (t.name === "b" && t.closest && t.closest("form[data-form=cap]")) paintCapAmount(t.form);
  if (t.name === "kind" && t.closest && t.closest("form[data-form=idea]")) { const f = t.form; f.querySelector(".idea-answer").hidden = t.value !== "savol"; f.querySelector("label[for=id-t]").textContent = t.value === "savol" ? "Savolingiz" : t.value === "goya" ? "G'oyangiz" : "Fikringiz"; }
  if (t.id === "dk-q") { const v = t.value.trim().toLowerCase(); let n = 0; for (const r of document.querySelectorAll(".dk-list .row-btn")) { const hit = !v || r.dataset.s.includes(v); r.hidden = !hit; n += hit; } $("#dk-none").hidden = !!n; }
  if (t.id === "bl-text") $("#bl-n").textContent = `${parseBulk(t.value).length} ta kartochka`;
  if (t.name === "a" && t.closest(".card-pair")) { const h = t.closest(".card-pair").querySelector(".qhint"); if (h) h.hidden = !(t.value.length > 140 || (t.value.match(/,|;/g) || []).length >= 4 || t.value.includes("\n")); }
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Enter" && t.matches && t.matches("#sheet input[type=text], #sheet input[type=number]")) {   // Enter moves on; only the button saves
    e.preventDefault();
    const f = [...t.form.querySelectorAll("input[type=text], input[type=number], textarea, button[type=submit]")], n = f[f.indexOf(t) + 1];
    if (n) n.focus();
    return;
  }
  if ($("#study").open && st && !(t.matches && t.matches("textarea, input"))) {
    if (st.mode === "cards" && st.i < st.deck.length) {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); act["fc-flip"](); }
      else if (e.key === "ArrowRight") fcAnswer(true);
      else if (e.key === "ArrowLeft") fcAnswer(false);
    } else if (st.mode === "learn" && st.cur && !st.cur.done && st.cur.kind === "mcq" && /^[1-4]$/.test(e.key)) {
      const b = document.querySelectorAll(".aopt")[+e.key - 1]; if (b) b.click();
    }
    return;
  }
  if (!$("#review").open || (t.matches && t.matches("textarea, input"))) return;
  if (!rv.shown && (e.key === "Enter" || e.key === " ") && !(t.closest && t.closest("button"))) { e.preventDefault(); act["rv-show"](); }
  else if (rv.shown && ["1", "2", "3", "4"].includes(e.key)) act["rv-grade"]({ dataset: { g: String(+e.key - 1) } });
});
$("#sheet").addEventListener("close", () => { lock(); if (ui.tab === "settings" && !ui.book) setTimeout(render, 0); if (chat.ctl) chat.ctl.abort(); if (pend.length) { pend.forEach(forgetFile); pend = []; } });
$("#auth").addEventListener("cancel", e => e.preventDefault());
document.addEventListener("change", async e => { const t = e.target;
  if (t.id === "tg-docs-on" || t.id === "tg-docs-h") {
    const on = $("#tg-docs-on"), h = $("#tg-docs-h");
    try { const r = await api("/api/tg/docs", { on: !!(on && on.checked), hour: h ? +h.value : 21 }); toast(r.docsOn ? `Hisobot har kuni soat ${pad(r.docsHour)}:00 da Telegram'ga keladi.` : "Kundalik hisobot o'chirildi."); }
    catch (err) { toast(err.msg || "Saqlanmadi."); }
    return;
  }
  if (t.id === "bl-photo" && t.files && t.files[0]) {
    const f = await shrink(t.files[0]), st = $("#bl-ai"), form = t.closest("form"), b = form && recs[form.dataset.id]; t.value = "";
    st.textContent = "Rasm o'qilmoqda…";
    try {
      const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
      addAiCards(await aiFrom({ image: data, title: b ? b.title : "" }));
    } catch (err) { st.textContent = (err && err.msg) || "Rasmni o'qib bo'lmadi."; }
    return;
  }
  if (t.id === "tts") { try { localStorage.setItem(TTS, t.checked ? "1" : "0"); } catch (err) { /* stays on */ } if (t.checked) say("Me'mori"); return; }
  if (t.id === "haptic") { try { localStorage.setItem(HAPTIC, t.checked ? "1" : "0"); } catch (err) { /* stays on */ } if (t.checked) buzz(15); return; } if (t.dataset && t.dataset.att && t.files && t.files.length) { const f = [...t.files]; t.value = ""; addAttachments(f, t.dataset.att); } });
$("#review").addEventListener("close", () => { lock(); render(); });
$("#onb").addEventListener("close", lock);
$("#study").addEventListener("close", () => { st = null; lock(); render(); });
$("#onb").addEventListener("cancel", () => { try { localStorage.setItem(ONB_KEY, "1"); } catch (e) { /* shown again next time */ } });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") return saveLocal(true);
  if (cloud.mode === "srv") { cloud.fails = 0; srvSync(); }
  else if (cloud.mode === "on" && cloud.dirty.size) { cloud.fails = 0; scheduleFlush(0); }
  if (today() !== lastDay && !$("#sheet").open && !$("#review").open) render();
});
window.addEventListener("pagehide", () => saveLocal(true));

loadLocal();
{ const n = $("#splash-name"); if (n) n.textContent = APP(); }
render();
setTimeout(() => { const sp = $("#splash"); if (sp) { sp.classList.add("gone"); setTimeout(() => sp.remove(), 450); } }, books().length ? 550 : 250);
connect();
try { if (!localStorage.getItem(ONB_KEY)) openOnb(); } catch (e) { /* storage blocked: skip the tour */ }
})();
</script>
